name: Docker

# Сборка релизного артефакта по Git-тегу vMAJOR.MINOR.PATCH (§43).
# Self-hosted runner = нативный linux/arm64, тот же, что у kind-ноды.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-push:
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloudshare:${{ steps.ver.outputs.VERSION }}" \
            cloudshare-app

      - name: Push image
        run: |
          docker push \
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloudshare:${{ steps.ver.outputs.VERSION }}"
