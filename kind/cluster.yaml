kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    # Маппинги согласованы с ansible/roles/nginx (апстримы 127.0.0.1:8080/:3000)
    # и с NodePort сервисов: cloudshare -> 30080, grafana -> 30300.
    # Прочие компоненты (prometheus, loki) доступны через kubectl port-forward —
    # внешних портов без эксплуатационной задачи не добавляем (README §49).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
