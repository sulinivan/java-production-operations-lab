---
# 1. Непривилегированный пользователь (docs/security.md, пункт 4)
- name: Create dedicated runner user
  ansible.builtin.user:
    name: "{{ runner_user }}"
    shell: /bin/bash
    groups: docker
    append: true
    create_home: true

- name: Resolve latest runner version
  ansible.builtin.shell: >
    curl -fsSL https://api.github.com/repos/actions/runner/releases/latest
    | jq -r .tag_name | sed 's/^v//'
  args:
    executable: /bin/bash
  register: runner_resolved_version
  changed_when: false

- name: Check whether runner binaries exist
  ansible.builtin.stat:
    path: "{{ runner_dir }}/config.sh"
  register: runner_binaries

- name: Download and unpack runner
  when: not runner_binaries.stat.exists
  block:
    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        mode: "0755"

    # go_arch наследуется от фактов хоста; runner публикует arm64 сборки
    - name: Download runner tarball
      ansible.builtin.command:
        cmd: >-
          curl -fsSL -o /tmp/actions-runner.tar.gz
          https://github.com/actions/runner/releases/download/v{{ runner_resolved_version.stdout }}/actions-runner-linux-arm64-{{ runner_resolved_version.stdout }}.tar.gz
      changed_when: true

    - name: Unpack runner
      ansible.builtin.unarchive:
        src: /tmp/actions-runner.tar.gz
        dest: "{{ runner_dir }}"
        remote_src: true
      become_user: "{{ runner_user }}"

    - name: Remove downloaded tarball
      ansible.builtin.file:
        path: /tmp/actions-runner.tar.gz
        state: absent

# 2. Регистрация. Пропускается если уже зарегистрирован или токен не передан.
- name: Check whether runner is registered
  ansible.builtin.stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_registered

- name: Register runner against GitHub repo
  ansible.builtin.command:
    cmd: >-
      ./config.sh
      --url {{ github_url }}
      --token {{ runner_token }}
      --name {{ runner_name }}
      --work {{ runner_dir }}/_work
      --unattended
    chdir: "{{ runner_dir }}"
    creates: "{{ runner_dir }}/.runner"
  become_user: "{{ runner_user }}"
  no_log: true  # токен не должен попасть в логи Ansible
  when:
    - runner_token is defined
    - runner_token | length > 0
    - not runner_registered.stat.exists

- name: Warn if registration skipped
  ansible.builtin.debug:
    msg: >-
      Runner binaries installed but NOT registered.
      Run: ansible-playbook ansible/playbooks/runner.yml -e runner_token=<one-time-token>
  when:
    - runner_token is not defined or runner_token | length == 0
    - not runner_registered.stat.exists

# 3. Systemd service — только для зарегистрированного runner'а
# (svc.sh без выполненной регистрации завершается с ошибкой)
- name: Install runner systemd service
  ansible.builtin.command:
    cmd: "./svc.sh install {{ runner_user }}"
    chdir: "{{ runner_dir }}"
    creates: /etc/systemd/system/{{ runner_unit }}
  when: runner_registered.stat.exists

- name: Start runner service if not running
  ansible.builtin.command: "./svc.sh start"
  args:
    chdir: "{{ runner_dir }}"
  register: runner_svc_start
  changed_when: "'started' in runner_svc_start.stdout | default('')"
  when: runner_registered.stat.exists

# 4. Kubeconfig для CD-задач runner'а.
# Выделенный ServiceAccount вместо копии admin-kubeconfig пользователя:
# креды CD изолированы, отзываются удалением SA и не переживают кластер.
- name: Create CD deployer service account, binding and token
  # От имени ansible_user: у root нет kubeconfig
  become: false
  ansible.builtin.shell: |
    set -e
    kubectl create sa cd-deployer -n kube-system --dry-run=client -o yaml | kubectl apply -f -
    cat <<'EOF' | kubectl apply -f -
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: cd-deployer-admin
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - kind: ServiceAccount
        name: cd-deployer
        namespace: kube-system
    EOF
    cat <<'EOF' | kubectl apply -f -
    apiVersion: v1
    kind: Secret
    metadata:
      name: cd-deployer-token
      namespace: kube-system
      annotations:
        kubernetes.io/service-account.name: cd-deployer
    type: kubernetes.io/service-account-token
    EOF
    for _ in $(seq 1 30); do
      TOKEN=$(kubectl -n kube-system get secret cd-deployer-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d)
      [ -n "$TOKEN" ] && break
      sleep 2
    done
    [ -n "$TOKEN" ] || { echo "token not populated" >&2; exit 1; }
    echo "TOKEN=$TOKEN"
    echo "SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
    echo "CA=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')"
  args:
    executable: /bin/bash
  register: cd_sa
  changed_when: false

- name: Parse CD credentials
  ansible.builtin.set_fact:
    kubeconfig_token: "{{ (cd_sa.stdout_lines | select('match', '^TOKEN=') | first) | split('=') | last }}"
    kubeconfig_server: "{{ (cd_sa.stdout_lines | select('match', '^SERVER=') | first) | split('=') | last }}"
    kubeconfig_ca_data: "{{ (cd_sa.stdout_lines | select('match', '^CA=') | first) | split('=') | last }}"

- name: Install CD kubeconfig for runner group
  ansible.builtin.template:
    src: kubeconfig-cd.j2
    dest: /opt/lab/kubeconfig-cd
    owner: root
    group: "{{ runner_user }}"
    mode: "0640"

- name: Verify CD kubeconfig works for runner user
  become_user: "{{ runner_user }}"
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/opt/lab/kubeconfig-cd get ns cloudshare -o name
  changed_when: false
