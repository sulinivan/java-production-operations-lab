---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - git
      - unzip
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Kernel settings required by kind (inotify limits)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: fs.inotify.max_user_watches, value: "524288" }
    - { name: fs.inotify.max_user_instances, value: "512" }

- name: Create lab directory
  ansible.builtin.file:
    path: /opt/lab
    state: directory
    mode: "0755"
