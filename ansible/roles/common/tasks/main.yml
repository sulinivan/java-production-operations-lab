---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - git
      - unzip
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Kernel settings required by kind (inotify limits)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: fs.inotify.max_user_watches, value: "524288" }
    - { name: fs.inotify.max_user_instances, value: "512" }

- name: Create lab directory owned by the admin user
  # Владелец — ansible_user: playbook cluster.yml выполняет kubectl/kind без
  # sudo (чтобы kubeconfig остался в домашнем каталоге пользователя)
  ansible.builtin.file:
    path: /opt/lab
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
