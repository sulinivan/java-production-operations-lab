image:
  repository: docker.io/sulinivan/cloudshare
  # Обязателен при deploy (--set image.tag=X.Y.Z); пустое значение — ошибка шаблона
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 8080
  # Согласован с extraPortMappings в kind/cluster.yaml (host 8080 -> node 30080)
  nodePort: 30080

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    periodSeconds: 5
    failureThreshold: 24   # JVM + Flyway migrations на старте
  liveness:
    periodSeconds: 10
    failureThreshold: 6
    # §23: liveness указывает ТОЛЬКО на livenessState — временный отказ
    # PostgreSQL не должен рестартовать pod (см. readiness ниже)
    path: /actuator/health/liveness
  readiness:
    periodSeconds: 10
    failureThreshold: 3
    path: /actuator/health/readiness

# Несекретная конфигурация приложения -> ConfigMap.
#
# СЕКРЕТЫ чарт НЕ создаёт: он ссылается на platform Secrets
# cloudshare-db / cloudshare-minio / cloudshare-app (ADR-009),
# созданные scripts/apply-secrets.sh вне релизного жизненного цикла Helm.
# Так helm rollback / переустановка релиза никогда не трогает credentials.
config:
  SPRING_DATASOURCE_URL: jdbc:postgresql://cloudshare-postgres:5432/cloudshare
  # Readiness учитывает состояние БД: БД недоступна -> pod снимается с
  # эндпоинтов, но liveness остаётся UP и pod не рестартует (§23).
  # Явный include надёжнее additional-paths на Boot 4.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
  STORAGE_PROVIDER: MINIO
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET_NAME: documents
  SPRING_DATA_REDIS_HOST: redis-cache
  SPRING_DATA_REDIS_PORT: "6379"
  SECURITY_REDIS_HOST: redis-security
  SECURITY_REDIS_PORT: "6379"
  RATE_LIMIT_REDIS_HOST: redis-ratelimit
  RATE_LIMIT_REDIS_PORT: "6379"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  # Пул на 50 соединений избыточен для одного пода лаборатории
  HIKARI_MAX_POOL_SIZE: "10"

credentials:
  dbSecretName: cloudshare-db
  minioSecretName: cloudshare-minio
  appSecretName: cloudshare-app

serviceMonitor:
  # Включается в фазе 6, когда в кластере появятся CRD prometheus-operator
  enabled: false
  interval: 30s
