# Loki — centralized log backend (README §27).
# SingleBinary достаточно для однонодовой лаборатории; object storage — MinIO
# bucket `loki` (вторая связь MinIO из README §20/§27).
# Credentials передаются при установке: --set-string loki.storage.s3.accessKeyId=...
deploymentMode: SingleBinary
fullnameOverride: loki

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: http://minio:9000
      s3ForcePathStyle: true
      insecure: true
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h  # неделя логов — достаточно для лаборатории

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 500m, memory: 1Gi }

# Для SingleBinary шардированные компоненты не нужны
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
