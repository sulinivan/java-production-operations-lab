# postgres-exporter — метрики PostgreSQL для Prometheus (README §24).
# Plain manifest вместо chart: зависимость от значений секрета минимальна,
# а ServiceMonitor тривиален. DATA_SOURCE_NAME собирается в apply-secrets.sh
# из тех же кредов, что использует приложение (роль pg_monitor выдаётся отдельно).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: cloudshare
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: exporter
          # v0.17.x молча умирает с exit 2 после определения версии сервера
          # (known issue); 0.15 — последняя стабильная с классическим поведением
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - name: web
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: cloudshare-pg-exporter
                  key: data-source-name
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: cloudshare
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: web
      port: 9187
      targetPort: web
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: cloudshare
  labels:
    app.kubernetes.io/part-of: java-production-operations-lab
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: web
      interval: 30s
